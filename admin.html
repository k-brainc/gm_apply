<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교육신청 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#1E2A38; --ink-2:#34445A; --paper:#F5F7FA; --white:#FFFFFF;
  --line:#D6DCE4; --muted:#5B6878; --signal:#F2A900; --signal-soft:#FFF4D1;
  --go:#1F7A55; --stop:#B83A2E; --r:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}

.top{background:var(--ink);color:#fff;padding:18px 0}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.2rem;font-weight:800;flex:1}
.top small{color:#B9C4D2}
.btn{height:38px;padding:0 14px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.btn.light{background:transparent;border-color:#7F8FA3;color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border-color:var(--line)}

/* login */
.login{max-width:360px;margin:12vh auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.login h2{margin:0 0 16px;font-size:1.15rem}
.login input{width:100%;height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.login .btn{width:100%;height:46px}

/* headline total */
.total{display:grid;grid-template-columns:auto 1fr;gap:10px 32px;align-items:end;padding:28px 0 20px}
.total .big{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.total .big span{font-size:1.4rem;color:var(--muted);font-weight:600}
.gauge{height:14px;background:#E3E8EE;border-radius:7px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ink)}
.total p{margin:6px 0 0;color:var(--muted);font-size:.9rem}

h2.sec{font-size:1rem;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
h2.sec small{color:var(--muted);font-weight:500}

.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#FAFBFC;color:var(--muted);font-weight:600;font-size:.84rem;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:#F7F9FB}
tr.sel td{background:var(--signal-soft)!important}

.bar{display:flex;align-items:center;gap:6px;min-width:96px}
.bar .track{flex:1;height:8px;background:#E3E8EE;border-radius:4px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ink-2)}
.bar.hi .track i{background:var(--signal)}
.bar.full .track i{background:var(--stop)}
.bar b{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem}

.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:1px 8px;border-radius:4px}
.tag.open{background:#E3F2EA;color:var(--go)}
.tag.full{background:#F8E4E1;color:var(--stop)}
.tag.closed{background:#E3E8EE;color:var(--muted)}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.filters select,.filters input{height:38px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 10px;background:var(--white)}
.filters input{flex:1;min-width:180px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list{max-height:560px;overflow:auto}
footer{padding:30px 0;color:var(--muted);font-size:.82rem}
.err{color:var(--stop);font-size:.88rem;min-height:1.2em;margin:0}

@media (max-width:900px){.grid2{grid-template-columns:1fr}.total{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1 id="title">교육신청 관리자</h1>
    <small id="stamp"></small>
    <button class="btn light" id="refresh" hidden>새로고침</button>
    <button class="btn light" id="csv" hidden>CSV 내려받기</button>
    <button class="btn light" id="logout" hidden>로그아웃</button>
  </div>
</header>

<section class="login" id="login">
  <h2>관리자 로그인</h2>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password" aria-label="관리자 비밀번호">
    <button class="btn" type="submit">조회하기</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<main class="wrap" id="dash" hidden>
  <div class="total">
    <div class="big num" id="totalBig"></div>
    <div>
      <div class="gauge" aria-hidden="true"><i id="totalGauge"></i></div>
      <p id="totalText"></p>
    </div>
  </div>

  <div class="grid2">
    <div>
      <h2 class="sec">지역별 현황 <small>행을 누르면 명단이 걸러집니다</small></h2>
      <div class="panel"><table>
        <thead><tr><th>지역</th><th class="r">과정</th><th class="r">정원</th><th class="r">신청</th><th class="r">잔여</th><th>모집률</th></tr></thead>
        <tbody id="regionBody"></tbody>
      </table></div>

      <h2 class="sec">과정별 현황</h2>
      <div class="panel"><table>
        <thead><tr><th>지역</th><th>일자</th><th>구분</th><th class="r">신청/정원</th><th>모집률</th><th>상태</th></tr></thead>
        <tbody id="sessionBody"></tbody>
      </table></div>
    </div>

    <div>
      <h2 class="sec">신청자 명단 <small id="listCount"></small></h2>
      <div class="filters">
        <select id="fRegion" aria-label="지역"></select>
        <select id="fSession" aria-label="과정"></select>
        <input id="fQuery" placeholder="이름, 판매코드, 전시장, 연락처 검색" aria-label="검색">
      </div>
      <div class="panel list"><table>
        <thead><tr><th>이름</th><th>판매코드</th><th>연락처</th><th>지역</th><th>전시장명</th><th>과정</th><th>신청일시</th><th class="r">변경</th></tr></thead>
        <tbody id="appBody"></tbody>
      </table></div>
    </div>
  </div>
  <footer id="foot"></footer>
</main>

<script>
/* ▼ Apps Script 웹 앱 배포 주소(/exec)를 입력하세요 */
const API_URL = 'https://script.google.com/macros/s/AKfycbwYsk6l-NNv6ca51MjtNKRYHEptvWC_kKHBEfV60GSWWW8glM_BggJ9HSaFD6wX7Kt9/exec';

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
let D = null;
let timer = null;

async function load() {
  const password = sessionStorage.getItem('eduAdminPw') || '';
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'adminDashboard', password }),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.message);
  D = json;
  render();
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  sessionStorage.setItem('eduAdminPw', $('pw').value);
  $('loginErr').textContent = '';
  try { await load(); enter(); }
  catch (err) { sessionStorage.removeItem('eduAdminPw'); $('loginErr').textContent = err.message; }
});

function enter() {
  $('login').hidden = true; $('dash').hidden = false;
  ['refresh','csv','logout'].forEach(id => $(id).hidden = false);
  clearInterval(timer);
  timer = setInterval(() => load().catch(() => {}), 60000); // 1분마다 자동 갱신
}

$('refresh').onclick = () => load().catch(e => alert(e.message));
$('logout').onclick = () => { sessionStorage.removeItem('eduAdminPw'); location.reload(); };

function barCell(applied, cap) {
  const r = pct(applied, cap);
  const cls = applied >= cap && cap ? 'full' : r >= 80 ? 'hi' : '';
  return `<div class="bar ${cls}"><span class="track"><i style="width:${Math.min(r,100)}%"></i></span><b>${r}%</b></div>`;
}

function regions() {
  const map = new Map();
  D.sessions.forEach(s => {
    const r = map.get(s.region) || { no: s.regionNo, name: s.region, count: 0, cap: 0, applied: 0 };
    r.count++; r.cap += s.capacity; r.applied += s.applied;
    map.set(s.region, r);
  });
  return [...map.values()].sort((a, b) => a.no - b.no);
}

function render() {
  $('title').textContent = D.title + ' 신청 관리';
  $('stamp').textContent = '갱신 ' + D.generatedAt.slice(5, 16);

  const cap = D.sessions.reduce((a, s) => a + s.capacity, 0);
  const applied = D.sessions.reduce((a, s) => a + s.applied, 0);
  const full = D.sessions.filter(s => s.status === 'full').length;
  $('totalBig').innerHTML = `${applied}<span> / ${cap}명</span>`;
  $('totalGauge').style.width = Math.min(pct(applied, cap), 100) + '%';
  $('totalText').textContent =
    `전체 모집률 ${pct(applied, cap)}% · 과정 ${D.sessions.length}개 중 ${full}개 정원 마감 · 취소 ${D.canceled}건 · 신청 기간 ${D.period.openAt} ~ ${D.period.closeAt}`;

  const fr = $('fRegion').value;
  $('regionBody').innerHTML = regions().map(r => `
    <tr class="clickable ${fr === r.name ? 'sel' : ''}" data-region="${esc(r.name)}">
      <td><b>${r.no}. ${esc(r.name)}</b></td><td class="r num">${r.count}</td><td class="r num">${r.cap}</td>
      <td class="r num"><b>${r.applied}</b></td><td class="r num">${r.cap - r.applied}</td><td>${barCell(r.applied, r.cap)}</td>
    </tr>`).join('');
  $('regionBody').querySelectorAll('tr').forEach(tr => tr.onclick = () => {
    $('fRegion').value = $('fRegion').value === tr.dataset.region ? '' : tr.dataset.region;
    $('fSession').value = '';
    render();
  });

  const label = { open: '모집중', full: '정원 마감', closed: '신청 종료' };
  const fs = $('fSession').value;
  $('sessionBody').innerHTML = D.sessions.map(s => `
    <tr class="clickable ${fs === s.id ? 'sel' : ''}" data-id="${esc(s.id)}">
      <td>${esc(s.region)}</td><td class="num">${esc(s.dateLabel)}</td><td>${esc(s.slot)}</td>
      <td class="r num">${s.applied} / ${s.capacity}</td><td>${barCell(s.applied, s.capacity)}</td>
      <td><span class="tag ${s.status}">${label[s.status]}</span></td>
    </tr>`).join('');
  $('sessionBody').querySelectorAll('tr').forEach(tr => tr.onclick = () => {
    $('fSession').value = $('fSession').value === tr.dataset.id ? '' : tr.dataset.id;
    render();
  });

  fillFilters();
  renderList();
  $('foot').textContent = `데이터 기준 ${D.generatedAt} · 1분마다 자동 갱신`;
}

function fillFilters() {
  const fr = $('fRegion').value, fs = $('fSession').value;
  $('fRegion').innerHTML = '<option value="">전체 지역</option>' +
    regions().map(r => `<option ${r.name === fr ? 'selected' : ''} value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  $('fSession').innerHTML = '<option value="">전체 과정</option>' +
    D.sessions.filter(s => !fr || s.region === fr)
      .map(s => `<option ${s.id === fs ? 'selected' : ''} value="${esc(s.id)}">${esc(s.region)} ${esc(s.dateLabel)} ${s.slot}</option>`).join('');
}

function filtered() {
  const fr = $('fRegion').value, fs = $('fSession').value, q = $('fQuery').value.trim().toLowerCase();
  return D.applicants
    .filter(a => (!fr || a.region === fr) && (!fs || a.sessionId === fs))
    .filter(a => !q || [a.name, a.code, a.dealer, a.phone].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.regionNo - b.regionNo || a.sessionId.localeCompare(b.sessionId) || a.appliedAt.localeCompare(b.appliedAt));
}

function renderList() {
  const rows = filtered();
  $('listCount').textContent = `${rows.length}명`;
  $('appBody').innerHTML = rows.length ? rows.map(a => `
    <tr>
      <td><b>${esc(a.name)}</b></td><td class="num">${esc(a.code)}</td><td class="num">${esc(a.phone)}</td>
      <td>${esc(a.region)}</td><td>${esc(a.dealer)}</td>
      <td class="num">${esc(a.dateLabel)} ${esc(a.slot)}</td><td class="num">${esc(a.appliedAt.slice(5, 16))}</td>
      <td class="r num">${a.changes || ''}</td>
    </tr>`).join('')
    : '<tr><td colspan="8" class="empty">조건에 맞는 신청자가 없습니다.</td></tr>';
}

$('fRegion').onchange = () => { $('fSession').value = ''; render(); };
$('fSession').onchange = render;
$('fQuery').oninput = renderList;

$('csv').onclick = () => {
  const head = ['신청번호','이름','판매코드','연락처','지역','교육장','전시장명','일자','구분','교육시간','신청일시','변경횟수','최종변경일시'];
  const rows = filtered().map(a => [a.no, a.name, a.code, a.phone, a.region, a.venue, a.dealer, a.dateLabel, a.slot, a.time, a.appliedAt, a.changes, a.updatedAt]);
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `교육신청명단_${D.generatedAt.slice(0, 10)}.csv`;
  a.click();
};

if (sessionStorage.getItem('eduAdminPw')) load().then(enter).catch(() => sessionStorage.removeItem('eduAdminPw'));
</script>
</body>
</html>
