<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>교육신청 관리자</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 글꼴은 화면 표시를 막지 않도록 비동기 로드 -->
<link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"></noscript>
<style>
/* gm.com 톤 참고 — 블랙 상단 바 · GM 블루(#0956FF) 강조 · 신청 페이지와 동일 체계 */
:root{
  --ink:#111418; --ink-2:#2B3038; --muted:#5E6570; --black:#0A0B0D;
  --brand:#0956FF; --brand-deep:#0640C9; --brand-sky:#4C82FF;
  --grad:linear-gradient(100deg,#2A6BFF 0%,#0956FF 60%,#0748E0 100%);
  --grad-v:linear-gradient(0deg,#0748E0 0%,#0956FF 55%,#3D78FF 100%);
  --brand-soft:#EBF1FF; --paper:#F4F5F7; --white:#FFFFFF; --line:#DDE1E7; --track:#E7EAEF;
  --signal:#E39A00; --signal-soft:#FFF4D6; --go:#0F8A5F; --stop:#C8372D;
  --r:16px; --r-sm:10px; --pill:999px;
  --shadow:0 4px 18px rgba(10,11,13,.07);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55;word-break:keep-all}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-sky);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}

/* 상단 바: 흰 바탕 + 그라데이션 라인 */
.top{background:var(--white);position:relative;padding:14px 0;box-shadow:0 2px 12px rgba(10,11,13,.06)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad)}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .brand-logo{height:26px;width:auto;margin-right:4px}
.top h1{margin:0;font-size:1.12rem;font-weight:800;letter-spacing:-.02em;flex:1}
.top small{color:var(--muted)}
.top label{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted);cursor:pointer}
.top label input{accent-color:var(--brand)}
.btn{height:36px;padding:0 16px;border-radius:var(--pill);border:1.5px solid var(--line);background:var(--white);color:var(--ink);font-weight:700;cursor:pointer;font-size:.88rem;transition:border-color .15s}
.btn:hover{border-color:var(--brand)}
.link-btn{display:inline-flex;align-items:center;text-decoration:none;border:0;background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(9,86,255,.25)}
.btn.solid{background:var(--grad);border:0;color:#fff}
.btn.ghost{background:var(--white);color:var(--ink);border-color:var(--line)}
.session{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);background:var(--brand-soft);border-radius:var(--pill);padding:4px 5px 4px 12px}
.session b{font-size:.95rem;color:var(--brand-deep);min-width:42px}
.session button{border:0;background:var(--white);color:var(--brand-deep);border-radius:var(--pill);padding:3px 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.session.warn{background:var(--signal-soft)}
.session.warn b{color:var(--signal)}

/* 로그인 */
.login{max-width:380px;margin:12vh auto;background:var(--white);border-radius:var(--r);box-shadow:0 14px 34px rgba(10,11,13,.12);padding:30px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad)}
.login h2{margin:0 0 18px;font-size:1.2rem;letter-spacing:-.02em}
.login h2::after{content:"";display:block;width:28px;height:4px;border-radius:2px;background:var(--grad);margin-top:8px}
.login input{width:100%;height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px}
.login input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px var(--brand-soft)}
.login .btn{width:100%;height:48px;font-size:1rem}
.err{color:var(--stop);font-size:.88rem;min-height:1.2em;margin:8px 0 0}

/* 연장 확인 창 */
.dlg{border:0;border-radius:var(--r);padding:28px 26px 22px;max-width:390px;width:calc(100% - 40px);box-shadow:0 24px 60px rgba(11,31,58,.3)}
.dlg::backdrop{background:rgba(11,31,58,.5);backdrop-filter:blur(2px)}
.dlg h2{margin:0 0 8px;font-size:1.15rem}
.dlg p{margin:0 0 20px;color:var(--muted);font-size:.94rem}
.dlg p b{color:var(--stop);font-size:1.05rem}
.dlg-actions{display:flex;gap:8px}
.dlg-actions .btn{flex:1;height:46px;font-size:.95rem}

.card{background:var(--white);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
h2.sec{font-size:1.05rem;margin:0 0 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;letter-spacing:-.02em}
h2.sec::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--grad-v);align-self:center}
h2.sec small{color:var(--muted);font-weight:500;font-size:.84rem}
.block{margin-top:22px}

/* KPI */
.kpi{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;margin-top:24px}
.donut{position:relative;width:188px;height:188px}
.donut svg{transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-size:2.35rem;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--brand-deep)}
.donut .c span{font-size:.86rem;color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--paper);border-radius:var(--r-sm);padding:14px 16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-v)}
.stat.go::before{background:var(--go)}
.stat.warn::before{background:var(--signal)}
.stat.stop::before{background:var(--stop)}
.stat b{display:block;font-size:1.85rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat b small{font-size:.95rem;color:var(--muted);font-weight:600}
.stat span{font-size:.84rem;color:var(--muted)}
.split{margin-top:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.split-row{display:flex;align-items:center;gap:10px;font-size:.88rem}
.split-row .lb{width:36px;font-weight:700}
.split-row .track{flex:1;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.split-row .track i{display:block;height:100%;background:var(--grad);border-radius:5px}
.split-row .v{text-align:right;color:var(--muted);white-space:nowrap}
.period{margin-top:14px;font-size:.86rem;color:var(--muted)}

/* 일정별 좌석 */
.timeline{display:flex;gap:22px;justify-content:space-between;overflow-x:auto;padding-bottom:6px}
.tl-region{flex:none}
.tl-head{position:relative;padding-bottom:8px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.tl-head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--grad)}
.tl-head b{font-size:1.05rem}
.tl-head span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.tl-region.sel .tl-head::after{background:var(--signal)}
.tl-days{display:flex;gap:12px}
.tl-day{display:flex;flex-direction:column;align-items:center}
.tanks{display:flex;gap:6px}
.tank-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.tank{position:relative;width:46px;height:132px;border:0;background:var(--track);border-radius:23px;overflow:hidden;cursor:pointer;padding:0}
.tank .fill{position:absolute;left:0;right:0;bottom:0;background:var(--grad-v);transition:height .4s}
.tank.hi .fill{background:var(--signal)}
.tank.full .fill{background:var(--stop)}
.tank.closed{background:repeating-linear-gradient(135deg,#EEF2F6 0 6px,#E2E8EF 6px 12px)}
.tank.closed .fill{background:#A3AEBC}
.tank .pct{position:absolute;left:0;right:0;top:10px;font-size:.76rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
.tank.full .pct,.tank.onfill .pct{color:#fff}
.tank.sel{outline:3px solid var(--signal);outline-offset:3px}
.tank-lb{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.25;font-variant-numeric:tabular-nums}
.tank-lb b{display:block;color:var(--ink);font-size:.8rem}
.tl-date{margin-top:8px;font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:16px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}

/* 지역 링 */
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.rings{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ring{border:1.5px solid transparent;border-radius:var(--r-sm);background:var(--paper);padding:16px 8px;text-align:center;cursor:pointer;transition:border-color .15s}
.ring:hover{border-color:var(--brand)}
.ring.sel{border-color:var(--signal);background:var(--signal-soft)}
.ring .mini{position:relative;width:80px;height:80px;margin:0 auto 8px}
.ring .mini svg{transform:rotate(-90deg)}
.ring .mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring h3{margin:0;font-size:1rem}
.ring p{margin:2px 0 0;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* 차트 */
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.col{flex:1 0 26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col i{display:block;width:100%;max-width:30px;background:var(--grad-v);border-radius:8px 8px 0 0;min-height:2px}
.col em{font-style:normal;font-size:.74rem;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.col-labels{display:flex;gap:6px;overflow:hidden}
.col-labels span{flex:1 0 26px;font-size:.7rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;font-size:.86rem}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .track{height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--grad);border-radius:6px}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:.9rem}

/* 명단 */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.filters select,.filters input{height:40px;border:1.5px solid var(--line);border-radius:var(--pill);padding:0 14px;background:var(--white)}
.filters input{flex:1;min-width:200px}
.filters input:focus,.filters select:focus{border-color:var(--brand);outline:none}
.filters .clear{height:40px;border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer}
.panel{background:var(--white);border-radius:var(--r);overflow:auto;max-height:560px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 14px;border-bottom:1px solid #EDF1F6;text-align:left;white-space:nowrap}
th{background:#F7F9FC;color:var(--muted);font-weight:600;font-size:.84rem;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFCFE}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:var(--pill);background:#EEF1F5;color:var(--ink-2)}
footer{padding:30px 0;color:var(--muted);font-size:.82rem}

@media (max-width:1000px){
  .kpi{grid-template-columns:1fr;justify-items:center}
  .stats{grid-template-columns:repeat(2,1fr);width:100%}
  .grid-2{grid-template-columns:1fr}
  .rings{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gmGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3D78FF"/><stop offset=".6" stop-color="#0956FF"/><stop offset="1" stop-color="#0748E0"/>
  </linearGradient></defs></svg>

<header class="top">
  <div class="wrap">
    <!-- 로고(선택): 저장소 images/logo.svg 에 컬러 로고를 올리면 표시 -->
    <img class="brand-logo" src="images/logo.svg" alt="" onerror="this.remove()">
    <h1 id="title">교육신청 관리자</h1>
    <small id="stamp"></small>
    <span class="session" id="sessionBox" hidden>접속 <b class="num" id="sessionLeft">05:00</b>
      <button type="button" id="sessionExtend">연장</button></span>
    <label id="testWrap" hidden><input type="checkbox" id="fTest" checked> <span id="fTestLabel">테스트 포함</span></label>
    <a class="btn link-btn" id="sheetLink" href="#" target="_blank" rel="noopener" hidden title="구글시트 원본을 새 탭에서 엽니다">원본 시트 열기 ↗</a>
    <button class="btn" id="refresh" hidden>새로고침</button>
    <button class="btn" id="csv" hidden>CSV 내려받기</button>
    <button class="btn" id="logout" hidden>로그아웃</button>
  </div>
</header>

<section class="login" id="login">
  <h2>관리자 로그인</h2>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password" aria-label="관리자 비밀번호">
    <button class="btn solid" type="submit">조회하기</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<dialog class="dlg" id="extendDlg" aria-labelledby="extendTitle">
  <h2 id="extendTitle">접속 시간을 연장할까요?</h2>
  <p><b class="num" id="extendLeft">60</b>초 뒤 자동으로 로그아웃되고 관리자 로그인 화면으로 돌아갑니다.</p>
  <div class="dlg-actions">
    <button type="button" class="btn ghost" id="extendNo">로그아웃</button>
    <button type="button" class="btn solid" id="extendYes">5분 연장</button>
  </div>
</dialog>

<main class="wrap" id="dash" hidden>

  <!-- 전체 현황 -->
  <section class="card kpi">
    <div class="donut" id="donut"></div>
    <div>
      <div class="stats" id="stats"></div>
      <div class="split" id="split"></div>
      <p class="period" id="periodText"></p>
    </div>
  </section>

  <!-- 일정별 좌석 -->
  <section class="card block">
    <h2 class="sec">일정별 좌석 현황 <small>막대를 누르면 해당 과정 명단이 아래에 걸러집니다</small></h2>
    <div class="timeline" id="timeline"></div>
    <div class="legend">
      <span><i style="background:var(--grad)"></i>모집 중</span>
      <span><i style="background:var(--signal)"></i>80% 이상</span>
      <span><i style="background:var(--stop)"></i>정원 마감</span>
      <span><i style="background:#9AA6B4"></i>신청 종료</span>
    </div>
  </section>

  <!-- 지역별 -->
  <section class="card block">
    <h2 class="sec">지역별 모집률 <small>카드를 누르면 지역 명단이 걸러집니다</small></h2>
    <div class="rings" id="rings"></div>
  </section>

  <div class="grid-2 block">
    <section class="card">
      <h2 class="sec">일자별 신청 추이 <small id="trendNote"></small></h2>
      <div id="trend"></div>
    </section>
    <section class="card">
      <h2 class="sec">전시장별 신청 인원 <small>상위 10곳</small></h2>
      <div id="dealers"></div>
    </section>
  </div>

  <!-- 명단 -->
  <section class="block">
    <h2 class="sec">신청자 명단 <small id="listCount"></small></h2>
    <div class="filters">
      <select id="fRegion" aria-label="지역"></select>
      <select id="fSession" aria-label="과정"></select>
      <input id="fQuery" placeholder="이름, 판매코드, 전시장, 연락처 검색" aria-label="검색">
      <button class="clear" id="clearFilter" type="button">필터 해제</button>
    </div>
    <div class="panel"><table>
      <thead><tr><th>이름</th><th>판매코드</th><th>연락처</th><th>지역</th><th>전시장명</th><th>과정</th><th>신청일시</th><th class="r">변경</th></tr></thead>
      <tbody id="appBody"></tbody>
    </table></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
/* ▼ Apps Script 웹 앱 배포 주소(/exec) */
const API_URL = 'https://script.google.com/macros/s/AKfycbwYsk6l-NNv6ca51MjtNKRYHEptvWC_kKHBEfV60GSWWW8glM_BggJ9HSaFD6wX7Kt9/exec';

const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
let D = null, timer = null;
let TOKEN = null;                 // 로그인 토큰: 메모리에만 보관 (새로고침·재접속 시 다시 로그인)
let EXPIRES = 0;                  // 접속 만료 시각(ms)
let clock = null;                 // 1초 간격 남은 시간 확인
const SESSION_SEC = 5 * 60;       // 기본 접속 시간 5분
const WARN_SEC = 60;              // 만료 1분 전 연장 여부 확인

// 이전 버전이 브라우저에 남긴 비밀번호 정리
try { sessionStorage.removeItem('eduAdminPw'); } catch (_) {}

/* ---------- 서버 통신 ---------- */
async function call(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload }),
  });
  const json = await res.json();
  if (!json.ok) throw Object.assign(new Error(json.message), { code: json.code });
  return json;
}

async function load() {
  try {
    D = await call('adminDashboard', { token: TOKEN });
    render();
  } catch (e) {
    if (e.code === 'AUTH_EXPIRED') logout(e.message);
    throw e;
  }
}

const withTest = () => $('fTest').checked;
function sessionsView() {
  if (!withTest()) return D.sessions;
  const add = {};
  (D.testApplicants || []).forEach(a => add[a.sessionId] = (add[a.sessionId] || 0) + 1);
  return D.sessions.map(s => {
    const applied = s.applied + (add[s.id] || 0);
    const status = s.status === 'closed' ? 'closed' : applied >= s.capacity ? 'full' : 'open';
    return Object.assign({}, s, { applied, status });
  });
}
const applicantsView = () => withTest() ? D.applicants.concat(D.testApplicants || []) : D.applicants;

function regionsOf(SV) {
  const map = new Map();
  SV.forEach(s => {
    const r = map.get(s.region) || { no: s.regionNo, name: s.region, venue: s.venue, sessions: [], cap: 0, applied: 0 };
    r.sessions.push(s); r.cap += s.capacity; r.applied += s.applied;
    map.set(s.region, r);
  });
  return [...map.values()].sort((a, b) => a.no - b.no);
}

const level = s => s.status === 'closed' ? 'closed' : s.status === 'full' ? 'full' : pct(s.applied, s.capacity) >= 80 ? 'hi' : '';

/* ---------- 도넛 ---------- */
function ring(size, stroke, ratio, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, v = Math.min(ratio, 1);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c * v} ${c}" stroke-linecap="${v > 0 && v < 1 ? 'round' : 'butt'}"/></svg>`;
}
const ringColor = (a, cap) => a >= cap && cap ? 'var(--stop)' : pct(a, cap) >= 80 ? 'var(--signal)' : 'url(#gmGrad)';

/* ---------- 렌더 ---------- */
function render() {
  const SV = sessionsView(), AV = applicantsView();
  const cap = SV.reduce((a, s) => a + s.capacity, 0);
  const applied = SV.reduce((a, s) => a + s.applied, 0);
  const full = SV.filter(s => s.status === 'full').length;
  const hot = SV.filter(s => s.status === 'open' && pct(s.applied, s.capacity) >= 80).length;
  const today = D.generatedAt.slice(0, 10);
  const todayCount = AV.filter(a => a.appliedAt.slice(0, 10) === today).length;
  const nTest = (D.testApplicants || []).length;

  $('title').textContent = D.title + ' 신청 현황';
  $('stamp').textContent = '갱신 ' + D.generatedAt.slice(5, 16);
  if (D.sheetUrl) $('sheetLink').href = D.sheetUrl;
  $('sheetLink').hidden = !D.sheetUrl;
  $('fTestLabel').textContent = `테스트 포함 (${nTest}건)`;

  // KPI
  $('donut').innerHTML = ring(188, 18, cap ? applied / cap : 0, ringColor(applied, cap)) +
    `<div class="c"><b class="num">${pct(applied, cap)}%</b><span class="num">${applied} / ${cap}명</span></div>`;
  $('stats').innerHTML = `
    <div class="stat go"><b class="num">${cap - applied}<small> 석</small></b><span>남은 좌석</span></div>
    <div class="stat warn"><b class="num">${hot}<small> 개</small></b><span>마감 임박 과정 (80% 이상)</span></div>
    <div class="stat stop"><b class="num">${full}<small> / ${SV.length}</small></b><span>정원 마감 과정</span></div>
    <div class="stat"><b class="num">${todayCount}<small> 명</small></b><span>오늘 신청</span></div>`;
  $('split').innerHTML = ['오전','오후'].map(slot => {
    const ss = SV.filter(s => s.slot === slot);
    const a = ss.reduce((x, s) => x + s.applied, 0), c = ss.reduce((x, s) => x + s.capacity, 0);
    return `<div class="split-row"><span class="lb">${slot}</span><span class="track"><i style="width:${Math.min(pct(a,c),100)}%"></i></span><span class="v num">${a} / ${c}명 · ${pct(a,c)}%</span></div>`;
  }).join('');
  const close = D.period.closeAt;
  $('periodText').textContent = (withTest() && nTest ? '테스트 신청 포함 수치 · ' : '') +
    `신청 기간 ${D.period.openAt} ~ ${close} · 취소 ${D.canceled}건`;

  // 좌석 타임라인
  const fr = $('fRegion').value, fs = $('fSession').value;
  $('timeline').innerHTML = regionsOf(SV).map(r => {
    const days = [];
    r.sessions.forEach(s => { let d = days.find(x => x.date === s.date); if (!d) days.push(d = { date: s.date, label: s.dateLabel, slots: [] }); d.slots.push(s); });
    return `<div class="tl-region${fr === r.name ? ' sel' : ''}">
      <div class="tl-head" data-region="${esc(r.name)}"><b>${esc(r.name)}</b><span class="num">${r.applied}/${r.cap} · ${pct(r.applied, r.cap)}%</span></div>
      <div class="tl-days">${days.map(d => `<div class="tl-day"><div class="tanks">${
        ['오전','오후'].map(slot => {
          const s = d.slots.find(x => x.slot === slot);
          if (!s) return '';
          const p = pct(s.applied, s.capacity);
          return `<div class="tank-wrap">
            <button class="tank ${level(s)}${p >= 88 && level(s) === '' ? ' onfill' : ''}${fs === s.id ? ' sel' : ''}" data-id="${esc(s.id)}" data-region="${esc(s.region)}"
              aria-label="${esc(s.region)} ${esc(s.dateLabel)} ${slot} ${s.applied}/${s.capacity}명 ${p}%">
              <span class="fill" style="height:${Math.min(p, 100)}%"></span><span class="pct">${Math.round(p)}%</span></button>
            <div class="tank-lb"><b>${slot}</b>${s.applied}/${s.capacity}</div></div>`;
        }).join('')}</div><div class="tl-date">${esc(d.label)}</div></div>`).join('')}</div></div>`;
  }).join('');
  $('timeline').querySelectorAll('.tank').forEach(b => b.onclick = () => {
    const same = $('fSession').value === b.dataset.id;
    $('fRegion').value = same ? '' : b.dataset.region;
    fillFilters();
    $('fSession').value = same ? '' : b.dataset.id;
    render(); scrollToList();
  });
  $('timeline').querySelectorAll('.tl-head').forEach(h => h.onclick = () => toggleRegion(h.dataset.region));

  // 지역 링
  $('rings').innerHTML = regionsOf(SV).map(r => `
    <div class="ring${fr === r.name ? ' sel' : ''}" role="button" tabindex="0" data-region="${esc(r.name)}">
      <div class="mini">${ring(78, 9, r.cap ? r.applied / r.cap : 0, ringColor(r.applied, r.cap))}<b>${Math.round(pct(r.applied, r.cap))}%</b></div>
      <h3>${esc(r.name)}</h3>
      <p>${r.applied} / ${r.cap}명</p><p>잔여 ${r.cap - r.applied}석 · 과정 ${r.sessions.length}개</p>
    </div>`).join('');
  $('rings').querySelectorAll('.ring').forEach(el => {
    el.onclick = () => toggleRegion(el.dataset.region);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRegion(el.dataset.region); } };
  });

  renderTrend(AV);
  renderDealers(AV);
  fillFilters();
  renderList();
  $('foot').textContent = `데이터 기준 ${D.generatedAt} · 1분마다 자동 갱신`;
}

function renderTrend(AV) {
  const by = {};
  AV.forEach(a => { const d = a.appliedAt.slice(0, 10); if (d) by[d] = (by[d] || 0) + 1; });
  const days = Object.keys(by).sort().slice(-21);
  $('trendNote').textContent = days.length ? `최근 ${days.length}일 · 누적 ${AV.length}명` : '';
  if (!days.length) { $('trend').innerHTML = '<div class="empty">아직 신청이 없습니다.</div>'; return; }
  const max = Math.max(...days.map(d => by[d]));
  $('trend').innerHTML = `<div class="cols">${days.map(d =>
      `<div class="col"><em>${by[d]}</em><i style="height:${by[d] / max * 100}%"></i></div>`).join('')}</div>
    <div class="col-labels">${days.map(d => `<span>${+d.slice(5,7)}/${+d.slice(8)}</span>`).join('')}</div>`;
}

function renderDealers(AV) {
  const by = {};
  AV.forEach(a => { const k = a.dealer || '(미기재)'; by[k] = (by[k] || 0) + 1; });
  const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (!top.length) { $('dealers').innerHTML = '<div class="empty">아직 신청이 없습니다.</div>'; return; }
  const max = top[0][1];
  $('dealers').innerHTML = `<div class="hbars">${top.map(([n, c]) =>
    `<div class="hbar"><span class="nm" title="${esc(n)}">${esc(n)}</span><span class="track"><i style="width:${c / max * 100}%"></i></span><b>${c}</b></div>`).join('')}</div>`;
}

/* ---------- 필터 & 명단 ---------- */
function toggleRegion(name) {
  $('fRegion').value = $('fRegion').value === name ? '' : name;
  $('fSession').value = '';
  render(); scrollToList();
}
function scrollToList() { $('listCount').scrollIntoView({ behavior: 'smooth', block: 'start' }); }

function fillFilters() {
  const fr = $('fRegion').value, fs = $('fSession').value;
  $('fRegion').innerHTML = '<option value="">전체 지역</option>' +
    regionsOf(D.sessions).map(r => `<option ${r.name === fr ? 'selected' : ''} value="${esc(r.name)}">${esc(r.name)}</option>`).join('');
  $('fSession').innerHTML = '<option value="">전체 과정</option>' +
    D.sessions.filter(s => !fr || s.region === fr)
      .map(s => `<option ${s.id === fs ? 'selected' : ''} value="${esc(s.id)}">${esc(s.region)} ${esc(s.dateLabel)} ${s.slot}</option>`).join('');
}

function filtered() {
  const fr = $('fRegion').value, fs = $('fSession').value, q = $('fQuery').value.trim().toLowerCase();
  return applicantsView()
    .filter(a => (!fr || a.region === fr) && (!fs || a.sessionId === fs))
    .filter(a => !q || [a.name, a.code, a.dealer, a.phone].join(' ').toLowerCase().includes(q))
    .sort((a, b) => a.regionNo - b.regionNo || a.sessionId.localeCompare(b.sessionId) || a.appliedAt.localeCompare(b.appliedAt));
}

function renderList() {
  const rows = filtered();
  const fr = $('fRegion').value, fsId = $('fSession').value;
  const s = fsId && D.sessions.find(x => x.id === fsId);
  $('listCount').textContent = (s ? `${s.region} ${s.dateLabel} ${s.slot} · ` : fr ? `${fr} · ` : '') + `${rows.length}명`;
  $('appBody').innerHTML = rows.length ? rows.map(a => `
    <tr>
      <td><b>${esc(a.name)}</b>${a.test ? ' <span class="tag">테스트</span>' : ''}</td><td class="num">${esc(a.code)}</td><td class="num">${esc(a.phone)}</td>
      <td>${esc(a.region)}</td><td>${esc(a.dealer)}</td>
      <td class="num">${esc(a.dateLabel)} ${esc(a.slot)}</td><td class="num">${esc(a.appliedAt.slice(5, 16))}</td>
      <td class="r num">${a.changes || ''}</td>
    </tr>`).join('')
    : '<tr><td colspan="8" class="empty">조건에 맞는 신청자가 없습니다.</td></tr>';
}

$('fRegion').onchange = () => { $('fSession').value = ''; render(); };
$('fSession').onchange = render;
$('fQuery').oninput = renderList;
$('clearFilter').onclick = () => { $('fRegion').value = ''; $('fSession').value = ''; $('fQuery').value = ''; render(); };

try { const v = localStorage.getItem('eduAdminWithTest'); if (v !== null) $('fTest').checked = v === '1'; } catch (_) {}
$('fTest').onchange = () => {
  try { localStorage.setItem('eduAdminWithTest', $('fTest').checked ? '1' : '0'); } catch (_) {}
  render();
};

/* ---------- 로그인 & 기타 ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value;
  $('pw').value = '';                     // 입력칸에 비밀번호를 남기지 않음
  $('loginErr').textContent = '';
  const btn = e.submitter || $('loginForm').querySelector('button');
  btn.disabled = true; btn.textContent = '불러오는 중…';
  try {
    const res = await call('adminLogin', { password: pw }); // 로그인 + 데이터 한 번에
    TOKEN = res.token; D = res;
    render();
    enter(res.session);
  } catch (err) {
    TOKEN = null;
    $('loginErr').textContent = err.message;
  } finally {
    btn.disabled = false; btn.textContent = '조회하기';
  }
});

function enter(sessionSec) {
  $('login').hidden = true; $('dash').hidden = false;
  ['refresh','csv','logout','testWrap','sessionBox'].forEach(id => $(id).hidden = false);
  clearInterval(timer);
  timer = setInterval(() => load().catch(() => {}), 60000);
  startSession(sessionSec || SESSION_SEC);
}

/* ---------- 접속 시간 관리 ---------- */
function startSession(sec) {
  EXPIRES = Date.now() + sec * 1000;
  closeExtend();
  clearInterval(clock);
  clock = setInterval(tick, 1000);
  tick();
}

const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

function tick() {
  if (!TOKEN) return;
  const left = Math.max(0, Math.ceil((EXPIRES - Date.now()) / 1000));
  $('sessionLeft').textContent = mmss(left);
  $('sessionBox').classList.toggle('warn', left <= WARN_SEC);
  if (left <= 0) return logout(`접속 시간(${SESSION_SEC / 60}분)이 지나 로그아웃되었습니다. 다시 로그인해 주세요.`);
  if (left <= WARN_SEC) {
    if (!$('extendDlg').open) openExtend();
    $('extendLeft').textContent = left;
  }
}

function openExtend() {
  const dlg = $('extendDlg');
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  $('extendYes').focus();
}
function closeExtend() {
  const dlg = $('extendDlg');
  if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); }
}

async function extend() {
  const btn = $('extendYes');
  btn.disabled = true; btn.textContent = '연장 중…';
  try {
    const res = await call('adminExtend', { token: TOKEN });
    startSession(res.session || SESSION_SEC);
  } catch (e) {
    logout(e.code === 'AUTH_EXPIRED' ? e.message : '연장하지 못했습니다. 다시 로그인해 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = '5분 연장';
  }
}

$('extendYes').onclick = extend;
$('extendNo').onclick = () => logout('로그아웃되었습니다.');
$('extendDlg').addEventListener('cancel', e => e.preventDefault()); // Esc로 닫혀 방치되지 않게
$('sessionExtend').onclick = extend;
// 탭이 백그라운드였다가 돌아오면 즉시 남은 시간 확인
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* 로그아웃: 서버 토큰 폐기 + 화면의 데이터 제거 */
function logout(message) {
  if (TOKEN) call('adminLogout', { token: TOKEN }).catch(() => {});
  TOKEN = null; D = null; EXPIRES = 0;
  clearInterval(timer); clearInterval(clock);
  closeExtend();
  ['refresh','csv','logout','testWrap','sheetLink','sessionBox'].forEach(id => $(id).hidden = true);
  $('sheetLink').href = '#';
  $('dash').hidden = true; $('login').hidden = false;
  ['timeline','rings','trend','dealers','appBody','stats','donut','split'].forEach(id => $(id).innerHTML = '');
  $('title').textContent = '교육신청 관리자'; $('stamp').textContent = '';
  $('loginErr').textContent = message || '';
  window.scrollTo(0, 0);
  $('pw').focus();
}

$('refresh').onclick = () => load().catch(e => { if (e.code !== 'AUTH_EXPIRED') alert(e.message); });
$('logout').onclick = () => logout('로그아웃되었습니다.');

$('csv').onclick = () => {
  const head = ['신청번호','이름','판매코드','연락처','지역','교육장','전시장명','일자','구분','교육시간','신청일시','변경횟수','최종변경일시','비고'];
  const rows = filtered().map(a => [a.no, a.name, a.code, a.phone, a.region, a.venue, a.dealer, a.dateLabel, a.slot, a.time, a.appliedAt, a.changes, a.updatedAt, a.test ? '테스트' : '']);
  const csv = '\uFEFF' + [head, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `교육신청명단_${D.generatedAt.slice(0, 10)}.csv`;
  a.click();
};

$('pw').focus();
</script>
</body>
</html>
